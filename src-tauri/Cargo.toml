[package]
name = "echotransfer"
version = "0.1.0"
description = "Sync Navidrome to Snowsky Echo SD cards"
authors = ["tsvetomirgt"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "echotransfer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
md-5 = "0.10.6"
rand = "0.9.5"
thiserror = "2.0.21"
futures = "0.3.34"
lofty = "0.25"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
sysinfo = "0.36.1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio-util = "0.7.19"
unicode-normalization = "0.1.25"
hex = "0.4.3"
url = "2.5.8"
dirs = "7.0.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
